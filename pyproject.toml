[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hashid"
version = "0.1.0"
description = "A simple CLI tool to identify hash types and algorithms."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
]

[project.scripts]
hashid = "hashid.cli:app"
